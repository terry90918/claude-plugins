kind: pipeline
type: docker
name: validate

platform:
  os: linux
  arch: amd64

trigger:
  event:
    - push
    - pull_request
  ref:
    - refs/heads/main
    - refs/pull/*/head

steps:
  - name: validate
    image: node:22.22.2-bookworm-slim
    commands:
      # commit-type guardrail 必須先於任何慢速的依賴安裝工作（npm ci、apt-get 皆是），
      # 否則一個壞掉的 PR title 本該讓 CI 快速失敗，卻要先付出安裝成本才會被拒絕——
      # scripts/validate-drone-config.mjs 強制這個順序，見該檔案的三段鏈式不變量。
      - node scripts/validate-pr-title.mjs
      - node scripts/validate-squash-subject.mjs
      # git／jq／shellcheck／python3 是三支 guard hook 與其測試的隱性依賴，缺席時
      # fail-open 且無聲（JUR-147／JUR-150 都撞過；python3 是本次補齊 git 後才在
      # worktree-hookspath-fix.sh 的 emit() fallback 暴露出來）。一次裝齊，不分散
      # 成多個 pipeline step。
      - apt-get update -qq && apt-get install -y --no-install-recommends git jq shellcheck python3 -qq
      - npm ci
      - npm run validate

---
kind: pipeline
type: docker
name: release

platform:
  os: linux
  arch: amd64

trigger:
  event:
    - push
  ref:
    - refs/heads/main

steps:
  - name: github-release
    image: node:22.22.2-bookworm-slim
    environment:
      GITHUB_API_TOKEN:
        from_secret: GITHUB_API_TOKEN
    commands:
      - npx --yes release-please@17.10.4 github-release --token=$GITHUB_API_TOKEN --repo-url=https://github.com/jurislm/jurislm-tools --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
  - name: release-pr
    image: node:22.22.2-bookworm-slim
    depends_on:
      - github-release
    environment:
      GITHUB_API_TOKEN:
        from_secret: GITHUB_API_TOKEN
    commands:
      - |
        set +e
        node scripts/release-eligibility.mjs
        eligibility_status=$?
        set -e
        case "$eligibility_status" in
          0)
            npx --yes release-please@17.10.4 release-pr --token=$GITHUB_API_TOKEN --repo-url=https://github.com/jurislm/jurislm-tools --target-branch=main --config-file=release-please-config.json --manifest-file=.release-please-manifest.json
            ;;
          10)
            echo "release-pr skipped: no feat/fix commit in the unreleased range"
            ;;
          *)
            exit "$eligibility_status"
            ;;
        esac

---
kind: pipeline
type: docker
name: release-pr-auto-merge

platform:
  os: linux
  arch: amd64

concurrency:
  limit: 1

trigger:
  event:
    - push
  ref:
    - refs/heads/main

depends_on:
  - validate
  - release

steps:
  - name: merge-release-pr
    image: node:22.22.2-bookworm-slim
    environment:
      GITHUB_API_TOKEN:
        from_secret: GITHUB_API_TOKEN
    commands:
      - node scripts/release-pr-auto-merge.mjs
